{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Denied</title>
    <link href="{% static 'inventory/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'inventory/css/bootstrap-icons.css' %}" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

    <div class="container" style="max-width: 480px;">
        <div class="card border-0 shadow-sm p-5 bg-white text-center">
            <div class="text-danger mb-2" style="font-size: 3rem;"><i class="bi bi-shield-lock-fill"></i></div>
            <h1 class="display-4 text-danger fw-bold mb-1">403</h1>
            <h4 class="fw-bold text-dark mb-3">Access Denied</h4>
            <p class="text-muted small mb-4">Your account tier lacks manager-level credentials for this workspace route.</p>
            <a href="{% url 'shop_home' %}" class="btn btn-primary w-100 py-2 fw-bold">Return to Home Hub</a>
        </div>
    </div>

</body>
</html>
