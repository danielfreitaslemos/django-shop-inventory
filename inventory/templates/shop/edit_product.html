{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard - Edit Product</title>
    <link href="{% static 'inventory/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'inventory/css/bootstrap-icons.css' %}" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

    <div class="container my-5" style="max-width: 500px;">
        <div class="card border-0 shadow-sm p-4 bg-white">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-dark m-0">Edit Product</h3>
                <p class="text-muted small mt-1">Updating details for <strong>{{ product.name }}</strong></p>
            </div>

            <form method="POST" action="{% url 'edit_product' product.id %}">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Product / Barcode Code</label>
                    <input type="text" name="product_code" class="form-control" value="{{ product.product_code }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Product Name</label>
                    <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Price ($)</label>
                    <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price }}" required>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary">Current Stock Count</label>
                    <input type="number" name="stock_count" class="form-control" value="{{ product.stock_count }}" required>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-warning py-2 fw-bold">Save Changes</button>
                    <a href="{% url 'manager_dashboard' %}" class="btn btn-outline-secondary py-2">Cancel and Go Back</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
