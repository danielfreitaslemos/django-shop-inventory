<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manager Dashboard - Edit Product</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .form-box { max-width: 400px; background: white; padding: 30px; margin: 0 auto; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .field { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .cancel-link { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; }
    </style>
</head>
<body>

    <div class="form-box">
        <h2>✏️ Edit Product: {{ product.name }}</h2>

        <form method="POST" action="">
            {% csrf_token %}

            <div class="field">
                <label>Product / Barcode Code:</label>
                <!-- value="{{ ... }}" pre-fills the input with current DB text -->
                <input type="text" name="product_code" value="{{ product.product_code }}" required>
            </div>

            <div class="field">
                <label>Product Name:</label>
                <input type="text" name="name" value="{{ product.name }}" required>
            </div>

            <div class="field">
                <label>Price ($):</label>
                <input type="number" step="0.01" name="price" value="{{ product.price }}" required>
            </div>

            <div class="field">
                <label>Current Stock Count:</label>
                <input type="number" name="stock_count" value="{{ product.stock_count }}" required>
            </div>

            <button type="submit">Save Changes</button>
            <a href="{% url 'manager_dashboard' %}" class="cancel-link">Cancel and Go Back</a>
        </form>
    </div>

</body>
</html>
