<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manager Dashboard - Add Product</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .form-box { max-width: 400px; background: white; padding: 30px; margin: 0 auto; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .field { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="form-box">
        <h2>🛠️ Manager: Add New Product</h2>

        <!-- POST method sends data securely. csrf_token prevents malicious form hijackings -->
        <form method="POST" action="">
            {% csrf_token %}

            <div class="field">
                <label>Product / Barcode Code:</label>
                <input type="text" name="product_code" required placeholder="e.g., 103">
            </div>

            <div class="field">
                <label>Product Name:</label>
                <input type="text" name="name" required placeholder="e.g., Cheeseburger">
            </div>

            <div class="field">
                <label>Price ($):</label>
                <input type="number" step="0.01" name="price" required placeholder="e.g., 9.99">
            </div>

            <div class="field">
                <label>Initial Stock Count:</label>
                <input type="number" name="stock_count" required placeholder="e.g., 50">
            </div>

            <button type="submit">Save Product to Database</button>
        </form>
    </div>

</body>
</html>
