{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard - Add Product</title>
    <link href="{% static 'inventory/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'inventory/css/bootstrap-icons.css' %}" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

    <div class="container my-5" style="max-width: 500px;">
        <div class="card border-0 shadow-sm p-4 bg-white">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-primary m-0">Add New Product</h3>
                <p class="text-muted small mt-1">Register a new item into the store database</p>
            </div>

            <form method="POST" action="">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Product / Barcode Code</label>
                    <input type="text" name="product_code" class="form-control" placeholder="e.g., 1001" required autofocus>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Product Name</label>
                    <input type="text" name="name" class="form-control" placeholder="e.g., Organic Coffee Beans" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Price ($)</label>
                    <input type="number" step="0.01" name="price" class="form-control" placeholder="0.00" required>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary">Initial Stock Count</label>
                    <input type="number" name="stock_count" class="form-control" placeholder="0" required>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary py-2 fw-bold">Save Product</button>
                    <a href="{% url 'manager_dashboard' %}" class="btn btn-outline-secondary py-2">Cancel and Go Back</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
