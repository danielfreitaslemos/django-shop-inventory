<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Shop OS{% endblock %}</title>
    <link href="{% static 'inventory/css/bootstrap.min.css' %}" rel="stylesheet">

<body class="bg-light {% block body_class %}{% endblock %}" {% block body_style %}{% endblock %}>
